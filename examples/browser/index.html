<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>PHP Debug Studio — Full-Stack Browser Tracing Example</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      padding: 40px;
      max-width: 640px;
      margin: 0 auto;
    }
    .card {
      background: #1e293b;
      padding: 24px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    button {
      background: #6366f1;
      color: white;
      border: none;
      padding: 10px 16px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
    }
    button:hover { background: #4f46e5; }
    pre {
      background: #090d16;
      padding: 12px;
      border-radius: 6px;
      overflow-x: auto;
      font-size: 13px;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="card">
    <h2>Full-Stack Browser Correlation Demo</h2>
    <p>Click below to issue a request. The Browser SDK automatically generates and attaches a W3C <code>traceparent</code> header, correlating this client event with the backend PHP span in PHP Debug Studio.</p>
    <button id="send-request">Send Traced Request</button>
    <h3>Last Request Headers</h3>
    <pre id="headers-log">No requests sent yet.</pre>
  </div>

  <script type="module">
    // Minimal standalone demonstrator of trace context injection
    function randomHex(bytes) {
      const arr = new Uint8Array(bytes);
      crypto.getRandomValues(arr);
      return Array.from(arr, b => b.toString(16).padStart(2, '0')).join('');
    }

    const btn = document.getElementById('send-request');
    const log = document.getElementById('headers-log');

    btn.addEventListener('click', async () => {
      const traceId = randomHex(16);
      const spanId = randomHex(8);
      const traceparent = `00-${traceId}-${spanId}-01`;

      log.textContent = `traceparent: ${traceparent}\nURL: http://localhost:8080/api/users\nTimestamp: ${new Date().toISOString()}`;

      try {
        const res = await fetch('http://localhost:8080/api/users', {
          headers: {
            'traceparent': traceparent,
            'Accept': 'application/json'
          }
        });
        const data = await res.json();
        log.textContent += `\nResponse: ` + JSON.stringify(data, null, 2);
      } catch (err) {
        log.textContent += `\n(Sample simulated offline: ${err.message})`;
      }
    });
  </script>
</body>
</html>

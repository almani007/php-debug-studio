[package]
name = "php-debug-studio-desktop"
version = "1.0.0"
description = "PHP Debug Studio Desktop Application by zoventra"
authors = ["zoventra"]
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = ["shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[features]
custom-protocol = ["tauri/custom-protocol"]

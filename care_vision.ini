; Xdebug configuration for PHP Debug Studio - care_vision project
; This enables offline-first debugging with PHP Debug Studio daemon on 127.0.0.1:8765

; Load Xdebug Zend extension
zend_extension=xdebug.so

; Debug mode - enable step debugging, profiling, etc.
xdebug.mode=debug

; Start Xdebug automatically with each request (no manual enable needed)
xdebug.start_with_request=yes

; Connect to the Debug Studio daemon loopback address
xdebug.client_host=127.0.0.1
xdebug.client_port=9003

; Disable automatic host discovery (we set client_host explicitly)
xdebug.discover_client_host=0

; IDE key - must match what Debug Studio expects
xdebug.idekey=PHP_DEBUG_STUDIO

; Optional: Path mapping for Docker/local environments
; xdebug.path_mapping="/var/www/html:/var/www/html"

; Optional: Limit max nesting depth
xdebug.max_nesting_level=256

; Optional: Collect superglobals
xdebug.collect_vars=yes

; Optional: Collect params
xdebug.collect_params=4

; Optional: Collect return values
xdebug.collect_return=yes

; Optional: Trace enabled
xdebug.trace_enable_trigger=1
version: '3.8'

services:
  php:
    image: php:8.3-fpm-alpine
    container_name: debug_studio_php
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./docker/php/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
    environment:
      - XDEBUG_MODE=debug,develop
      - XDEBUG_CONFIG=client_host=host.docker.internal client_port=9003 start_with_request=yes
      - DEBUG_STUDIO_ENDPOINT=http://host.docker.internal:8765
      - DEBUG_STUDIO_PROJECT_ID=docker-sample
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - debug_studio_net

  nginx:
    image: nginx:alpine
    container_name: debug_studio_nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - debug_studio_net

  mysql:
    image: mysql:8.0
    container_name: debug_studio_mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: debug_studio_test
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - debug_studio_net

  redis:
    image: redis:alpine
    container_name: debug_studio_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - debug_studio_net

networks:
  debug_studio_net:
    driver: bridge

volumes:
  mysql_data:

name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  php-tests:
    name: PHP Matrix Tests (v${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none

      - name: Install PHP Dependencies
        run: |
          cd packages/php-core
          composer install --prefer-dist --no-interaction --no-progress

      - name: Run PHP Unit Tests
        run: |
          cd packages/php-core
          ./vendor/bin/phpunit --testdox

  go-tests:
    name: Go Local Daemon Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Verify Go Daemon Build
        run: |
          cd apps/daemon
          go vet ./...
          go test -v ./...
          go build -o bin/daemon main.go

  ts-build:
    name: TypeScript & Frontend Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Root Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Application
        run: |
          cd apps/web
          npm ci || npm install
          npm run build

      - name: Build CLI Runner
        run: |
          cd packages/cli
          npm ci || npm install
          npm run build

  smoke-tests:
    name: E2E Smoke & Verification Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Smoke Test
        run: |
          chmod +x tests/e2e/smoke_test.sh
          ./tests/e2e/smoke_test.sh

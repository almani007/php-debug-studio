name: Release Distribution

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-daemon:
    name: Build Daemon (${{ matrix.os }}/${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - os: darwin
            arch: arm64
            binary: php-debug-studio-daemon-darwin-arm64
          - os: darwin
            arch: amd64
            binary: php-debug-studio-daemon-darwin-amd64
          - os: linux
            arch: amd64
            binary: php-debug-studio-daemon-linux-amd64
          - os: linux
            arch: arm64
            binary: php-debug-studio-daemon-linux-arm64
          - os: windows
            arch: amd64
            binary: php-debug-studio-daemon-windows-amd64.exe

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compile Cross-Platform Daemon
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          cd apps/daemon
          mkdir -p dist
          go build -ldflags="-s -w -X main.version=${{ github.ref_name }}" -o dist/${{ matrix.binary }} main.go

      - name: Upload Daemon Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.binary }}
          path: apps/daemon/dist/${{ matrix.binary }}

  build-desktop:
    name: Build Desktop App (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            platform: macos
            artifact-name: desktop-macos
          - os: ubuntu-22.04
            platform: linux
            artifact-name: desktop-linux
          - os: windows-latest
            platform: windows
            artifact-name: desktop-windows

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Dependencies (Ubuntu)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Dependencies
        run: |
          npm ci || npm install

      - name: Build Web Assets
        run: |
          cd apps/web
          npm ci || npm install
          npm run build

      - name: Build Tauri Desktop Application
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: "./apps/desktop"
          tagName: ${{ github.ref_name }}
          releaseName: "PHP Debug Studio ${{ github.ref_name }}"
          releaseBody: "Cross-platform Desktop Application and Local Daemon by zoventra"

  publish-release:
    name: Create GitHub Release
    needs: [build-daemon, build-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries

      - name: Generate SHA256 Checksums
        run: |
          cd release-binaries
          find . -type f -exec sha256sum {} + > SHA256SUMS.txt

      - name: Finalize GitHub Release Assets
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-binaries/**/*
            release-binaries/SHA256SUMS.txt
          draft: false
          prerelease: false
          generate_release_notes: true
